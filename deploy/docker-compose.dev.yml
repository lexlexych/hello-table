# СКЕЛЕТ dev-окружения (итерация 1). Разработка ведётся локально, отдельного
# dev-сервера нет (docs/PROJECT.md §8.2). Сервисы наполняются в своих итерациях:
# postgres — 2, livekit (dev-режим) — 3, n8n — 5.

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: app_owner
      TZ: Europe/Berlin
    ports:
      # 55432, а не 5432: на машине разработчика уже может стоять нативный
      # PostgreSQL, который держит стандартный порт. На сервере это не важно —
      # там postgres вообще не публикуется наружу (PROJECT.md §3.1).
      - "55432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d restaurant"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata-dev:

  # livekit (dev-режим, --dev) — добавляется в итерации 3
  # n8n — добавляется в итерации 5
