  slot_in_past: "Это время уже прошло. На когда мне забронировать?"
  invalid_category: "Извините, я не смогла отнести ваш вопрос к какой-либо категории. О чём идёт речь, если коротко?"
  summary_too_long: "Извините, я сформулирую ваш вопрос ещё раз, покороче."
