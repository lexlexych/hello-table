# Перед настоящим разговором с клиентом оператор обязан проверить и при необходимости
# поправить этот текст юридически. Его нельзя удалять и нельзя переносить после приветствия.
ai_disclosure: "Обратите внимание: вы разговариваете с голосовым помощником на основе искусственного интеллекта."
greeting: "Здравствуйте, чем могу помочь?"
goodbye: "Спасибо за звонок. До свидания."
error_unavailable: "Извините, голосовой сервис сейчас недоступен. Пожалуйста, попробуйте позвонить позже."

# Ответы на коды ошибок инструментов. Клиент базы возвращает только код —
# формулировку выбирает агент здесь, чтобы она оставалась предсказуемой.
tool_errors:
  timeout: "Извините, это занимает слишком много времени. Пожалуйста, свяжитесь с рестораном напрямую."
  unreachable: "Извините, система ресторана сейчас недоступна. Пожалуйста, свяжитесь с рестораном напрямую."
  invalid_response: "Извините, у меня сейчас нет надёжного ответа на это. Пожалуйста, свяжитесь с рестораном напрямую."
  invalid_request: "Извините, мне не хватает одной детали. Назовите, пожалуйста, день, время и количество гостей."
  restaurant_not_found: "Извините, система ресторана сейчас недоступна. Пожалуйста, свяжитесь с рестораном напрямую."
  no_table_available: "К сожалению, на это время свободных столиков нет. Хотите другое время?"
  table_not_available: "К сожалению, этот столик уже нельзя забронировать. Я с удовольствием посмотрю свободные ещё раз."
  table_already_booked: "Этот столик только что заняли. Я с удовольствием посмотрю свободные ещё раз."
